<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pxT pxD">
  <title id="pxT">Parallax: every finding has to survive eight lines of sight</title>
  <desc id="pxD">Illustration of Parallax. A chest film shows two highlighted regions, finding A and finding B. Eight checks light up in turn: it points, the pointing matters (deletion test), stable under eight perturbations, calibrated with conformal sets, a second reader looks, the notes testify, the report cannot lie, every step leaves a receipt. Finding A passes all eight and reaches the report as "Doctor, consider". Finding B fails the deletion test, because blurring its region does not lower confidence, and is stamped withheld: the heatmap was decoration. A hash chain of receipts fills along the bottom.</desc>
  <defs>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .head { font-size: 13px; fill: #e6edf3; font-weight: 700; } .sub { font-size: 10.5px; fill: #6e7681; }
      .chk { font-size: 11.5px; fill: #c9d1d9; } .n { font-size: 11px; fill: #6e7681; }
      .colh { font-size: 10px; fill: #8b949e; letter-spacing: 1px; }
      .rep { font-size: 11.5px; fill: #c9d1d9; } .dim { font-size: 10px; fill: #6e7681; }
      .heat { animation: heat 3s ease-in-out infinite; }
      .blur { animation: blur 12s infinite; opacity: 0; }
      .stamp { transform-box: fill-box; transform-origin: center; animation: stamp 12s infinite; opacity: 0; }
      .report { animation: report 12s infinite; opacity: 0; }
      .fadeB { animation: fadeB 12s infinite; }
      @keyframes heat { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }
      @keyframes blur { 0%, 10% { opacity: 0; } 13%, 22% { opacity: .95; } 26%, 100% { opacity: 0; } }
      @keyframes stamp { 0%, 20% { opacity: 0; transform: scale(2) rotate(-8deg); } 23% { opacity: 1; transform: scale(1) rotate(-8deg); } 90% { opacity: 1; transform: scale(1) rotate(-8deg); } 96%, 100% { opacity: 0; transform: scale(1) rotate(-8deg); } }
      @keyframes report { 0%, 66% { opacity: 0; transform: translateY(6px); } 70%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; } }
      @keyframes fadeB { 0%, 22% { opacity: .9; } 26%, 92% { opacity: .2; } 96%, 100% { opacity: .9; } }
      @keyframes row0 { 0%, 1.67% { opacity: .35; } 4.17%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark0 { 0%, 1.67% { opacity: 0; transform: scale(1.8); } 4.17%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk0 { 0%, 1.67% { opacity: .15; } 4.17%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      @keyframes row1 { 0%, 8.33% { opacity: .35; } 10.83%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark1 { 0%, 8.33% { opacity: 0; transform: scale(1.8); } 10.83%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk1 { 0%, 8.33% { opacity: .15; } 10.83%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      @keyframes row2 { 0%, 15.00% { opacity: .35; } 17.50%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark2 { 0%, 15.00% { opacity: 0; transform: scale(1.8); } 17.50%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk2 { 0%, 15.00% { opacity: .15; } 17.50%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      @keyframes row3 { 0%, 21.67% { opacity: .35; } 24.17%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark3 { 0%, 21.67% { opacity: 0; transform: scale(1.8); } 24.17%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk3 { 0%, 21.67% { opacity: .15; } 24.17%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      @keyframes row4 { 0%, 28.33% { opacity: .35; } 30.83%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark4 { 0%, 28.33% { opacity: 0; transform: scale(1.8); } 30.83%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk4 { 0%, 28.33% { opacity: .15; } 30.83%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      @keyframes row5 { 0%, 35.00% { opacity: .35; } 37.50%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark5 { 0%, 35.00% { opacity: 0; transform: scale(1.8); } 37.50%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk5 { 0%, 35.00% { opacity: .15; } 37.50%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      @keyframes row6 { 0%, 41.67% { opacity: .35; } 44.17%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark6 { 0%, 41.67% { opacity: 0; transform: scale(1.8); } 44.17%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk6 { 0%, 41.67% { opacity: .15; } 44.17%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      @keyframes row7 { 0%, 48.33% { opacity: .35; } 50.83%, 90% { opacity: 1; } 96%, 100% { opacity: .35; } }
      @keyframes mark7 { 0%, 48.33% { opacity: 0; transform: scale(1.8); } 50.83%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes blk7 { 0%, 48.33% { opacity: .15; } 50.83%, 90% { opacity: 1; } 96%, 100% { opacity: .15; } }
      .row0 { animation: row0 12s infinite; opacity: .35; } .mark0 { animation: mark0 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk0 { animation: blk0 12s infinite; opacity: .15; }
      .row1 { animation: row1 12s infinite; opacity: .35; } .mark1 { animation: mark1 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk1 { animation: blk1 12s infinite; opacity: .15; }
      .row2 { animation: row2 12s infinite; opacity: .35; } .mark2 { animation: mark2 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk2 { animation: blk2 12s infinite; opacity: .15; }
      .row3 { animation: row3 12s infinite; opacity: .35; } .mark3 { animation: mark3 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk3 { animation: blk3 12s infinite; opacity: .15; }
      .row4 { animation: row4 12s infinite; opacity: .35; } .mark4 { animation: mark4 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk4 { animation: blk4 12s infinite; opacity: .15; }
      .row5 { animation: row5 12s infinite; opacity: .35; } .mark5 { animation: mark5 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk5 { animation: blk5 12s infinite; opacity: .15; }
      .row6 { animation: row6 12s infinite; opacity: .35; } .mark6 { animation: mark6 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk6 { animation: blk6 12s infinite; opacity: .15; }
      .row7 { animation: row7 12s infinite; opacity: .35; } .mark7 { animation: mark7 12s infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .blk7 { animation: blk7 12s infinite; opacity: .15; }
    </style>
    <radialGradient id="hA"><stop offset="0" stop-color="#ff7b72" stop-opacity=".95"/><stop offset=".5" stop-color="#d29922" stop-opacity=".55"/><stop offset="1" stop-color="#d29922" stop-opacity="0"/></radialGradient>
    <radialGradient id="hB"><stop offset="0" stop-color="#ff7b72" stop-opacity=".85"/><stop offset=".5" stop-color="#d29922" stop-opacity=".45"/><stop offset="1" stop-color="#d29922" stop-opacity="0"/></radialGradient>
    <radialGradient id="film" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#05070b"/></radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="#8b949e" opacity=".55"/></pattern>
    <clipPath id="filmclip"><rect x="24" y="62" width="200" height="236" rx="6"/></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="318" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="30" class="head">parallax — a finding has to prove itself before a doctor sees it</text>
  <text x="24" y="46" class="sub">eight independent checks · what can't be proven is withheld, and shown as withheld</text>

  <!-- the film -->
  <g clip-path="url(#filmclip)">
    <rect x="24" y="62" width="200" height="236" fill="url(#film)"/>
    <path d="M74,96 C52,140 52,232 82,268 C104,272 112,250 114,220 L116,110 C110,92 88,86 74,96 Z" fill="#30363d" opacity=".55"/>
    <path d="M174,96 C196,140 196,232 166,268 C144,272 136,250 134,220 L132,110 C138,92 160,86 174,96 Z" fill="#30363d" opacity=".55"/>
    <rect x="120" y="70" width="8" height="220" fill="#8b949e" opacity=".35"/>
    <g fill="none" stroke="#c9d1d9" stroke-opacity=".28" stroke-width="3">
      <path d="M120,110 C90,104 64,116 56,134"/><path d="M128,110 C158,104 184,116 192,134"/>
      <path d="M120,134 C88,128 60,140 52,160"/><path d="M128,134 C160,128 188,140 196,160"/>
      <path d="M120,158 C88,152 60,166 52,186"/><path d="M128,158 C160,152 188,166 196,186"/>
      <path d="M120,182 C88,176 62,190 56,210"/><path d="M128,182 C160,176 186,190 192,210"/>
      <path d="M120,206 C92,200 68,214 62,232"/><path d="M128,206 C156,200 180,214 186,232"/>
    </g>
    <ellipse class="heat" cx="160" cy="226" rx="30" ry="24" fill="url(#hA)"/>
    <g class="fadeB"><ellipse class="heat" cx="78" cy="128" rx="26" ry="20" fill="url(#hB)" style="animation-delay:-1.4s"/></g>
    <rect class="blur" x="50" y="106" width="56" height="44" rx="4" fill="url(#hatch)"/>
    <rect x="24" y="62" width="200" height="236" fill="none" stroke="#30363d" rx="6"/>
  </g>
  <rect x="146" y="252" width="28" height="16" rx="3" fill="#0d1117" opacity=".85"/><text x="160" y="264" class="dim" text-anchor="middle" fill="#e6edf3">A</text>
  <rect x="64" y="84" width="28" height="16" rx="3" fill="#0d1117" opacity=".85"/><text x="78" y="96" class="dim" text-anchor="middle" fill="#e6edf3">B</text>
  <g class="blur"><rect x="34" y="154" width="180" height="20" rx="4" fill="#0d1117" stroke="#f85149" stroke-opacity=".6"/><text x="124" y="168" class="dim" text-anchor="middle" fill="#ffa198">B blurred: conf 0.81 → 0.80</text></g>

  <!-- the eight lines of sight -->
  <text x="252" y="76" class="colh">LINE OF SIGHT</text>
  <text x="566" y="76" class="colh" text-anchor="middle">A</text>
  <text x="602" y="76" class="colh" text-anchor="middle">B</text>

  <g>
    <text x="252" y="100" class="chk row0"><tspan class="n">1 </tspan>it has to point</text>
    <text x="252" y="124" class="chk row1"><tspan class="n">2 </tspan>the pointing has to matter</text>
    <text x="252" y="148" class="chk row2"><tspan class="n">3 </tspan>stable under 8 perturbations</text>
    <text x="252" y="172" class="chk row3"><tspan class="n">4 </tspan>calibrated · conformal 90%</text>
    <text x="252" y="196" class="chk row4"><tspan class="n">5 </tspan>a second reader looks too</text>
    <text x="252" y="220" class="chk row5"><tspan class="n">6 </tspan>the notes testify</text>
    <text x="252" y="244" class="chk row6"><tspan class="n">7 </tspan>the report can't lie</text>
    <text x="252" y="268" class="chk row7"><tspan class="n">8 </tspan>every step leaves a receipt</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" style="transform-box: fill-box; transform-origin: center;">
    <text x="566" y="101" fill="#3fb950" class="mark0">✓</text>
    <text x="566" y="125" fill="#3fb950" class="mark1">✓</text>
    <text x="566" y="149" fill="#3fb950" class="mark2">✓</text>
    <text x="566" y="173" fill="#3fb950" class="mark3">✓</text>
    <text x="566" y="197" fill="#3fb950" class="mark4">✓</text>
    <text x="566" y="221" fill="#3fb950" class="mark5">✓</text>
    <text x="566" y="245" fill="#3fb950" class="mark6">✓</text>
    <text x="566" y="269" fill="#3fb950" class="mark7">✓</text>
    <text x="602" y="101" fill="#3fb950" class="mark0">✓</text>
    <text x="602" y="125" fill="#f85149" class="mark1">✗</text>
    <text x="602" y="149" fill="#484f58" class="mark2">–</text>
    <text x="602" y="173" fill="#484f58" class="mark3">–</text>
    <text x="602" y="197" fill="#484f58" class="mark4">–</text>
    <text x="602" y="221" fill="#484f58" class="mark5">–</text>
    <text x="602" y="245" fill="#484f58" class="mark6">–</text>
    <text x="602" y="269" fill="#3fb950" class="mark7">✓</text>
  </g>

  <!-- the report -->
  <rect x="636" y="62" width="240" height="214" rx="6" fill="#0b1220" stroke="#30363d"/>
  <text x="650" y="82" class="colh">REPORT</text>
  <g class="report">
    <text x="650" y="108" class="rep" fill="#3fb950">A · 8 of 8 lines of sight</text>
    <text x="650" y="128" class="rep">Doctor, consider:</text>
    <text x="650" y="146" class="rep">left lower zone opacity.</text>
    <text x="650" y="164" class="dim">calibrated · second reader agrees</text>
    <text x="650" y="180" class="dim">notes: "cough, 5 days" (span 41–55)</text>
  </g>
  <g class="stamp">
    <rect x="652" y="200" width="208" height="56" rx="4" fill="#2d1214" stroke="#f85149" stroke-width="2"/>
    <text x="756" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149" letter-spacing="2">B · WITHHELD</text>
    <text x="756" y="242" text-anchor="middle" class="dim" fill="#ffa198">the heatmap was decoration</text>
  </g>

  <!-- receipts -->
  <text x="252" y="300" class="dim">receipts</text>
  <g font-size="9" fill="#8b949e">
    <g class="blk0"><rect x="314" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="320" y="300">9f2c…</text></g>
    <g class="blk1"><path d="M366,296 h8" stroke="#30363d"/><rect x="374" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="380" y="300">41ab…</text></g>
    <g class="blk2"><path d="M426,296 h8" stroke="#30363d"/><rect x="434" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="440" y="300">c07e…</text></g>
    <g class="blk3"><path d="M486,296 h8" stroke="#30363d"/><rect x="494" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="500" y="300">5d19…</text></g>
    <g class="blk4"><path d="M546,296 h8" stroke="#30363d"/><rect x="554" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="560" y="300">e8a4…</text></g>
    <g class="blk5"><path d="M606,296 h8" stroke="#30363d"/><rect x="614" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="620" y="300">3b60…</text></g>
    <g class="blk6"><path d="M666,296 h8" stroke="#30363d"/><rect x="674" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="680" y="300">a7d2…</text></g>
    <g class="blk7"><path d="M726,296 h8" stroke="#30363d"/><rect x="734" y="288" width="52" height="16" rx="3" fill="#161b22" stroke="#30363d"/><text x="740" y="300">0f5b…</text></g>
  </g>
  <text x="798" y="300" class="dim">SHA-256</text>
</svg>
