<svg width="290" height="84" viewBox="0 0 290 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RECOVER: retry the payment">
  <title>RECOVER: retry the payment</title>
  <defs><style>
    text { font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .cap { animation: press 2.4s 0.0s ease-in-out infinite; }
    .ring { animation: ring 2.4s 0.0s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes press { 0%,40%,60%,100% { transform: translateY(0); } 48%,52% { transform: translateY(5px); } }
    @keyframes ring { 0%,44% { opacity:0; transform: scale(1); } 50% { opacity:.9; } 80%,100% { opacity:0; transform: scale(1.08,1.25); } }
  </style></defs>
  <rect x="9" y="12" width="272" height="66" rx="14" fill="none" stroke="#3fb950" stroke-width="2" class="ring"/>
  <rect x="9" y="17" width="272" height="62" rx="14" fill="#0f2a17"/>
  <g class="cap">
    <rect x="9" y="7" width="272" height="64" rx="14" fill="#0f2a17" stroke="#3fb950" stroke-width="2.5"/>
    <rect x="21" y="13" width="248" height="5" rx="2.5" fill="#ffffff" opacity=".10"/>
    <text x="145" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#3fb950" letter-spacing="3">RECOVER</text>
    <text x="145" y="60" text-anchor="middle" font-size="11" fill="#8b949e">retry the payment</text>
  </g>
</svg>
