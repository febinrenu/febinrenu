<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reTitle reDesc">
  <title id="reTitle">Reclaim's decision engine, simulated</title>
  <desc id="reDesc">Diagram of Reclaim's real pipeline: failed-payment, abandoned-checkout, and overdue-invoice events flow into a risk engine (calibrated logistic regression plus expected-value optimization, 0.69 ROC-AUC), which routes most events to recover or do-nothing and a minority to human escalation, producing 1.42 times the net recovery of retrying every payment across 574 automated tests.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      .rail { stroke: #21262d; stroke-width: 2; fill: none; }
      .gate { fill: #0d1a2b; stroke: #58a6ff; stroke-width: 1.4; animation: pulse 2.4s ease-in-out infinite; }
      .gateLabel { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.5px; fill: #e6edf3; font-weight: 700; }
      .gateSub { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #8b949e; }
      .outLabel { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; fill: #c9d1d9; }
      .head { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #e6edf3; font-weight: 700; }
      .sub { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; fill: #6e7681; }
      .legend { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #8b949e; }
      .swatch-a { fill: #f85149; } .swatch-b { fill: #d29922; } .swatch-c { fill: #58a6ff; }
      .dot-a { fill: #f85149; } .dot-b { fill: #d29922; } .dot-c { fill: #58a6ff; }
      @keyframes pulse { 0%, 100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="898" height="258" rx="10"/>
  <rect class="border" x="1" y="1" width="898" height="258" rx="10"/>

  <text x="24" y="30" class="head">reclaim — decision engine, running</text>
  <text x="24" y="46" class="sub">every event priced individually · recover, escalate to a human, or leave it alone</text>

  <!-- rails (static guide lines, dim) -->
  <path class="rail" d="M60,130 L380,130 L520,130 C620,130 680,60 780,60" opacity="0.5"/>
  <path class="rail" d="M60,130 L380,130 L520,130 L780,130" opacity="0.5"/>
  <path class="rail" d="M60,130 L380,130 L520,130 C620,130 680,200 780,200" opacity="0.5"/>

  <!-- gate -->
  <rect class="gate" x="380" y="90" width="140" height="80" rx="8"/>
  <text x="450" y="122" text-anchor="middle" class="gateLabel">RISK ENGINE</text>
  <text x="450" y="140" text-anchor="middle" class="gateSub">logistic regression + EV</text>
  <text x="450" y="154" text-anchor="middle" class="gateSub">0.69 ROC-AUC</text>

  <!-- outcome labels -->
  <circle cx="790" cy="60" r="4" fill="#3fb950"/>
  <text x="802" y="64" class="outLabel">RECOVER</text>
  <circle cx="790" cy="130" r="4" fill="#d29922"/>
  <text x="802" y="134" class="outLabel">ESCALATE</text>
  <circle cx="790" cy="200" r="4" fill="#6e7681"/>
  <text x="802" y="204" class="outLabel">DO NOTHING</text>

  <!-- moving events: three outcome paths, staggered, mixed colors -->
  <circle r="4.5" class="dot-a">
    <animateMotion dur="4.5s" begin="0s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 C620,130 680,60 780,60"/>
  </circle>
  <circle r="4.5" class="dot-b">
    <animateMotion dur="4.5s" begin="0.6s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 C620,130 680,200 780,200"/>
  </circle>
  <circle r="4.5" class="dot-c">
    <animateMotion dur="4.5s" begin="1.2s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 L780,130"/>
  </circle>
  <circle r="4.5" class="dot-a">
    <animateMotion dur="4.5s" begin="1.8s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 C620,130 680,200 780,200"/>
  </circle>
  <circle r="4.5" class="dot-b">
    <animateMotion dur="4.5s" begin="2.4s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 C620,130 680,60 780,60"/>
  </circle>
  <circle r="4.5" class="dot-c">
    <animateMotion dur="4.5s" begin="3.0s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 C620,130 680,60 780,60"/>
  </circle>
  <circle r="4.5" class="dot-a">
    <animateMotion dur="4.5s" begin="3.6s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 L780,130"/>
  </circle>
  <circle r="4.5" class="dot-b">
    <animateMotion dur="4.5s" begin="4.2s" repeatCount="indefinite" path="M60,130 L380,130 L520,130 C620,130 680,200 780,200"/>
  </circle>

  <!-- legend -->
  <rect class="swatch-a" x="24" y="226" width="8" height="8" rx="2"/>
  <text x="38" y="234" class="legend">failed payment</text>
  <rect class="swatch-b" x="150" y="226" width="8" height="8" rx="2"/>
  <text x="164" y="234" class="legend">abandoned checkout</text>
  <rect class="swatch-c" x="300" y="226" width="8" height="8" rx="2"/>
  <text x="314" y="234" class="legend">overdue invoice</text>

  <text x="780" y="234" text-anchor="end" class="sub">1.42× net recovery vs. retry-all · 574 tests</text>
</svg>
